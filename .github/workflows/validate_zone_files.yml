# Description: Validates osmosis.zone_assets.json and osmosis.zone_chains.json
#              against their schemas on pull requests.
# Included in: NOT included in Generate All Files bundle (PR validation only)
# Trigger: Automatically runs on pull requests to main branch
# Output: Pass/fail validation status for PR checks (one leg per file kind)

on:
  pull_request:
    branches:
      - main
name: Validate against Schema
jobs:
  validate_zone_files:
    name: ${{ matrix.kind }} files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: assets
            file: osmosis.zone_assets.json
            schema: zone_assets.schema.json
          - kind: chains
            file: osmosis.zone_chains.json
            schema: zone_chains.schema.json
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate zone ${{ matrix.kind }} schema
        # ajv-cli is pinned in package.json. The zone schemas are draft-07;
        # strict mode is off because they carry the non-standard `example`
        # annotation keyword.
        run: |
          for file in $(find . -name '${{ matrix.file }}' -not -path './node_modules/*' -not -path './chain-registry/*'); do
            pnpm exec ajv validate --spec=draft7 --strict=false -s ./${{ matrix.schema }} -d "$file"
          done
