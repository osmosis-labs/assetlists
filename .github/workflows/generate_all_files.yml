# Description: Bundle workflow that runs the complete asset generation pipeline
# Includes: Endpoint validation, assetlist generation, chainlist generation,
#           state updates, comment generation, and localization
# Schedule: Runs daily at 15:00 UTC
# Trigger: Manual via workflow_dispatch or scheduled cron
# Output: Creates PR with all generated files to branch 'update/assetlist_all'

on:
  schedule:
    - cron: "0 15 * * *"    # Every day at 15:00 UTC
  workflow_dispatch:

name: Generate All Files
jobs:
  generate_zone_config:
    name: Generate All Files
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash
    
    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          
      - name: Git Submodule Update
        run: |
          git submodule update --init --remote --recursive
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine weekly (Monday) run
        run: |
          # Monday (UTC) enables the corroborated weekly extras: the
          # counterparty client sweep in check_ibc_clients.mjs and the
          # gov-proposal scan + cosmos.directory corroboration in
          # report_dead_chains.mjs. Computed once here so every step that
          # gates on it uses the same reading (a run straddling midnight
          # must not flip cadence mid-pipeline).
          if [ "$(date -u +%u)" = "1" ]; then
            echo "WEEKLY_FLAG=--weekly" >> $GITHUB_ENV
            echo "DEAD_CHAINS_WEEKLY=true" >> $GITHUB_ENV
          else
            echo "WEEKLY_FLAG=" >> $GITHUB_ENV
            echo "DEAD_CHAINS_WEEKLY=false" >> $GITHUB_ENV
          fi

      - name: Snapshot zone_assets before lifecycle scripts
        run: |
          # Per-mutation symbol extraction depends on a clean before/after
          # diff of zone_assets. The three lifecycle scripts mutate it in
          # sequence, so we snapshot once here and diff once at the end.
          cp osmosis-1/osmosis.zone_assets.json /tmp/zone-before.json

          # Manual halts are applied by human PRs, not lifecycle scripts, so
          # they never appear in the in-run before/after diff. To surface
          # "newly halted this run", capture the previous run's manual-halt
          # chain set, which is persisted as state.json's top-level
          # manualHaltChains key (committed by the prior run). Missing on the
          # first run after this lands, in which case the delta is empty.
          jq -r '(.manualHaltChains // []) | sort | .[]' \
            osmosis-1/generated/state/state.json 2>/dev/null \
            > /tmp/manual-halts-prev.txt || touch /tmp/manual-halts-prev.txt

      - name: Check Tooltip Expiry (curator-flagged removals/decays)
        working-directory: ./.github/workflows/utility
        # Runs first among the lifecycle scripts: an expired tooltip must be
        # cleared (or decayed) before the lock-respecting scripts
        # (check_ibc_clients, check_market_health, check_extended_halts)
        # evaluate, so they don't treat an already-expired tooltip as a live
        # curator lock for one extra run.
        run: node check_tooltip_expiry.mjs osmosis-1 2>&1 | tee ../../../tooltip-expiry.log

      - name: Start Endpoint Validation (background)
        working-directory: ./.github/workflows/utility
        # Endpoint validation is network-bound and independent of the lifecycle
        # steps below, so it runs alongside them and "Wait for Endpoint
        # Validation" collects it. It writes only state.json's chains and
        # lastValidationRun; the lifecycle scripts write state.assets and merge
        # on write, and every concurrent writer renames a temp file into place.
        # A chain killed by a lifecycle step this run is still validated once
        # more, and is skipped from the next run.
        run: |
          # The exit code is renamed into place so the wait step never reads
          # validation.rc before its contents are written.
          nohup bash -c 'node validateEndpoints.mjs fullValidation osmosis > ../../../validation.log 2>&1; echo $? > ../../../validation.rc.tmp; mv ../../../validation.rc.tmp ../../../validation.rc' > /dev/null 2>&1 &

      - name: Check IBC Client Status
        working-directory: ./.github/workflows/utility
        run: |
          set +e
          # $WEEKLY_FLAG (Mondays) adds the counterparty client sweep:
          # remote-side clients tracking Osmosis, 2-run corroborated streaks.
          node check_ibc_clients.mjs osmosis-1 $WEEKLY_FLAG 2>&1 | tee ../../../ibc-check.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 2 ]; then
            # Mutation cap hit: not a failure, but flag it so the workflow
            # summary surfaces the event for human follow-up.
            echo "IBC_CAP_HIT=true" >> $GITHUB_ENV
          elif [ "$rc" -ne 0 ]; then
            exit $rc
          fi
          echo "IBC_NEWLY_FLAGGED=$(grep -oP 'IBC_NEWLY_FLAGGED=\K[0-9]+' ../../../ibc-check.log || echo 0)" >> $GITHUB_ENV
          echo "IBC_NEWLY_CLEARED=$(grep -oP 'IBC_NEWLY_CLEARED=\K[0-9]+' ../../../ibc-check.log || echo 0)" >> $GITHUB_ENV
          echo "IBC_ERRORS=$(grep -oP 'IBC_ERRORS=\K[0-9]+' ../../../ibc-check.log || echo 0)" >> $GITHUB_ENV
          # Counterparty-sweep counters (emitted on weekly runs only; default 0).
          echo "IBC_CP_CANDIDATES=$(grep -oP 'IBC_CP_CANDIDATES=\K[0-9]+' ../../../ibc-check.log || echo 0)" >> $GITHUB_ENV
          echo "IBC_CP_HALTED=$(grep -oP 'IBC_CP_HALTED=\K[0-9]+' ../../../ibc-check.log || echo 0)" >> $GITHUB_ENV
          echo "IBC_CP_SWEEP_INVALID=$(grep -oP 'IBC_CP_SWEEP_INVALID=\K[0-9]+' ../../../ibc-check.log || echo 0)" >> $GITHUB_ENV

      - name: Check Market Health (independent unstable track)
        working-directory: ./.github/workflows/utility
        run: node check_market_health.mjs osmosis-1 2>&1 | tee ../../../market-health.log

      - name: Check Extended Halts (60d + planned shutdown)
        working-directory: ./.github/workflows/utility
        run: |
          set +e
          node check_extended_halts.mjs osmosis-1 2>&1 | tee ../../../extended-halts.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 2 ]; then
            echo "EXTENDED_HALTS_CAP_HIT=true" >> $GITHUB_ENV
          elif [ "$rc" -ne 0 ]; then
            exit $rc
          fi

      - name: Add Chain Stubs
        working-directory: ./.github/workflows/utility
        run: node add_chain_stubs.mjs osmosis-1

      - name: Wait for Endpoint Validation
        working-directory: ./.github/workflows/utility
        timeout-minutes: 30
        run: |
          while [ ! -f ../../../validation.rc ]; do sleep 5; done
          cat ../../../validation.log
          exit "$(cat ../../../validation.rc)"

      - name: Generate Validation Report
        working-directory: ./.github/workflows/utility
        run: node validateEndpoints.mjs generateReport > ../../../validation-summary.md

      - name: Capture Current Assets
        run: |
          if [ -f osmosis-1/generated/frontend/assetlist.json ]; then
            jq -r '.assets[].symbol' osmosis-1/generated/frontend/assetlist.json | sort > /tmp/assets-before.txt
            # Capture verified status for each asset
            jq -r '.assets[] | "\(.symbol)|\(.verified // false)"' osmosis-1/generated/frontend/assetlist.json > /tmp/verified-before.txt
            # Full pre-generation copy, for the auto-merge gate's identity diff.
            # The symbol lists above only reveal additions and removals; changes
            # to decimals / denoms / transfer paths on an asset that keeps its
            # symbol need the whole prior record to compare against.
            cp osmosis-1/generated/frontend/assetlist.json /tmp/frontend-before.json
          else
            touch /tmp/assets-before.txt
            touch /tmp/verified-before.txt
            # No prior list: the gate treats a missing snapshot as "cannot compare"
            # and blocks, rather than reading every asset as unchanged.
            rm -f /tmp/frontend-before.json
          fi

      - name: Capture Current Chains
        run: |
          if [ -f osmosis-1/generated/frontend/chainlist.json ]; then
            jq -r '.chains[].chain_name' osmosis-1/generated/frontend/chainlist.json | sort > /tmp/chains-before.txt
          else
            touch /tmp/chains-before.txt
          fi

      - name: Run code to Generate Assetlist
        working-directory: ./.github/workflows/utility
        run: node generate_assetlist.mjs

      - name: Run code to Generate Chainlist
        working-directory: ./.github/workflows/utility
        run: node generate_chainlist.mjs

      - name: Run code to Sync Keplr Factory Tokens
        working-directory: ./.github/workflows/utility
        run: node sync_keplr_factory_tokens.mjs

      - name: Detect New Assets
        run: |
          jq -r '.assets[].symbol' osmosis-1/generated/frontend/assetlist.json | sort > /tmp/assets-after.txt
          comm -13 /tmp/assets-before.txt /tmp/assets-after.txt > new-assets.txt
          echo "NEW_ASSETS_COUNT=$(wc -l < new-assets.txt)" >> $GITHUB_ENV
          # Removed/delisted assets: symbols present before but gone after. A
          # rename also lands here (old symbol on this side, new symbol in
          # new-assets.txt), so this doubles as the rename's removal half.
          comm -23 /tmp/assets-before.txt /tmp/assets-after.txt > removed-assets.txt
          echo "REMOVED_ASSETS_COUNT=$(wc -l < removed-assets.txt)" >> $GITHUB_ENV

      - name: Detect Newly Verified Assets
        run: |
          # Capture current verified status
          jq -r '.assets[] | "\(.symbol)|\(.verified // false)"' osmosis-1/generated/frontend/assetlist.json > /tmp/verified-after.txt

          # Find assets that changed from false to true, in one pass (a per-asset
          # grep loop took ~5s). A symbol counts only when it appears exactly
          # once before, as false; a new asset that's already verified, or a
          # duplicated symbol, is not counted as newly verified.
          awk -F'|' 'FILENAME == ARGV[1] { n[$1]++; before[$1] = $2; next }
            n[$1] == 1 && before[$1] == "false" && $2 == "true" { print $1 }' \
            /tmp/verified-before.txt /tmp/verified-after.txt > newly-verified.txt

          echo "NEWLY_VERIFIED_COUNT=$(wc -l < newly-verified.txt 2>/dev/null || echo 0)" >> $GITHUB_ENV

      - name: Detect New Chains
        run: |
          jq -r '.chains[].chain_name' osmosis-1/generated/frontend/chainlist.json | sort > /tmp/chains-after.txt
          comm -13 /tmp/chains-before.txt /tmp/chains-after.txt > new-chains.txt
          echo "NEW_CHAINS_COUNT=$(wc -l < new-chains.txt)" >> $GITHUB_ENV
          # Removed chains: present before but gone after (delisted/pruned).
          comm -23 /tmp/chains-before.txt /tmp/chains-after.txt > removed-chains.txt
          echo "REMOVED_CHAINS_COUNT=$(wc -l < removed-chains.txt)" >> $GITHUB_ENV

      - name: Extract per-mutation symbol lists
        run: |
          # Diff /tmp/zone-before.json (snapshot pre-lifecycle) against the
          # current zone_assets.json to produce one symbol list per mutation
          # category. Each file is "chain_name|SYMBOL" per line. Symbol is
          # resolved against the freshly-generated frontend assetlist.
          #
          # Keying: a single (chain_name, base_denom) pair can be listed on
          # more than one IBC channel (e.g. a re-pathed asset whose old, dead
          # channel still lingers in zone_assets). Those entries are distinct
          # rows that differ only by `path`, so keying on chain_name|base_denom
          # alone collapses them — the before/after compare and symbol lookup
          # bleed across channels and produce phantom flagged/cleared lines for
          # the wrong variant. Key on `path` (unique per IBC entry), falling
          # back to chain_name|base_denom for non-IBC entries that have no path.
          jq -r --slurpfile fe osmosis-1/generated/frontend/assetlist.json --slurpfile before /tmp/zone-before.json '
            def feKey: (([.transferMethods[]? | select(.type == "ibc") | .chain.path] | first) // (.chainName + "|" + .sourceDenom));
            def zoneKey: (.path // (.chain_name + "|" + .base_denom));
            ($fe[0].assets | map({key: feKey, value: .symbol}) | from_entries) as $symByOrigin
            | ($before[0].assets | map({key: zoneKey, value: .}) | from_entries) as $beforeByOrigin
            | .assets as $now
            | $now | map(
                . as $a
                | $beforeByOrigin[$a | zoneKey] as $b
                | ($symByOrigin[$a | zoneKey] // $a._comment // $a.base_denom) as $sym
                | {
                    chain: $a.chain_name,
                    symbol: $sym,
                    # Reason the asset is currently flagged unstable. Surfaced
                    # in the "Flagged unstable" row so the reader can tell
                    # *why* an asset was flagged (ibc_client, market, manual,
                    # source_chain_killed, ...) rather than just that it was.
                    # ibcFlagged / ibcCleared fire on the unstable flag from
                    # any check, not only the IBC client check; the names are
                    # kept because the auto-merge gate keys on them.
                    reason: ($a.osmosis_unstable_reason // "?"),
                    ibcFlagged:
                      ((($a.osmosis_unstable // false) == true) and (($b.osmosis_unstable // false) != true)),
                    ibcCleared:
                      ((($a.osmosis_unstable // false) != true) and (($b.osmosis_unstable // false) == true)),
                    extendedHaltSet:
                      ((($a.osmosis_halt_deposits // false) == true)
                        and (($a.osmosis_deposit_halt_reason // "") == "extended_unstable_market")
                        and (($b.osmosis_deposit_halt_reason // "") != "extended_unstable_market")),
                    extendedHaltCleared:
                      ((($a.osmosis_halt_deposits // false) != true)
                        and (($b.osmosis_deposit_halt_reason // "") == "extended_unstable_market")),
                    plannedShutdownSet:
                      ((($a.osmosis_halt_deposits // false) == true)
                        and (($a.osmosis_deposit_halt_reason // "") == "planned_shutdown")
                        and (($b.osmosis_deposit_halt_reason // "") != "planned_shutdown")),
                    # Script-owned halts not already covered by the extended /
                    # planned-shutdown rows above: check_ibc_clients sets these
                    # with reason `bridge_down` or `source_chain_killed` when a
                    # bridge goes down or a source chain is killed. Both
                    # directions are tracked independently because a chain death
                    # closes withdrawals (funds-out), which is higher
                    # consequence than deposits and was previously unsurfaced.
                    # Set = newly halted this run; cleared = was halted with one
                    # of these reasons, now no longer. The reason fields below
                    # let the summary report which.
                    depositHaltReason: ($a.osmosis_deposit_halt_reason // ""),
                    withdrawalHaltReason: ($a.osmosis_withdrawal_halt_reason // ""),
                    bridgeOrKillDepositSet:
                      ((($a.osmosis_halt_deposits // false) == true)
                        and (["bridge_down", "source_chain_killed"] | index($a.osmosis_deposit_halt_reason // "") != null)
                        and ((($b.osmosis_halt_deposits // false) != true)
                          or (["bridge_down", "source_chain_killed"] | index($b.osmosis_deposit_halt_reason // "") == null))),
                    bridgeOrKillDepositCleared:
                      ((($a.osmosis_halt_deposits // false) != true)
                        and (($b.osmosis_halt_deposits // false) == true)
                        and (["bridge_down", "source_chain_killed"] | index($b.osmosis_deposit_halt_reason // "") != null)),
                    bridgeOrKillWithdrawalSet:
                      ((($a.osmosis_halt_withdrawals // false) == true)
                        and (["bridge_down", "source_chain_killed"] | index($a.osmosis_withdrawal_halt_reason // "") != null)
                        and ((($b.osmosis_halt_withdrawals // false) != true)
                          or (["bridge_down", "source_chain_killed"] | index($b.osmosis_withdrawal_halt_reason // "") == null))),
                    bridgeOrKillWithdrawalCleared:
                      ((($a.osmosis_halt_withdrawals // false) != true)
                        and (($b.osmosis_halt_withdrawals // false) == true)
                        and (["bridge_down", "source_chain_killed"] | index($b.osmosis_withdrawal_halt_reason // "") != null)),
                    # Unstable reason changed while the asset stayed unstable
                    # (e.g. market → bridge_down, or manual → source_chain_killed
                    # on a chain death). The ibcFlagged/ibcCleared rows only fire
                    # on the boolean flipping, so a reason shift underneath an
                    # already-flagged asset was previously silent. Old→new is
                    # carried so the summary can show the transition.
                    unstableReasonChanged:
                      ((($a.osmosis_unstable // false) == true)
                        and (($b.osmosis_unstable // false) == true)
                        and (($a.osmosis_unstable_reason // "") != ($b.osmosis_unstable_reason // ""))),
                    unstableReasonOld: ($b.osmosis_unstable_reason // ""),
                    # Symbol / display-name change. zone_assets carries the human
                    # label in `_comment` ("Pretty (Chain) $SYMBOL"); a rebrand
                    # (XION→VERONA) or a .legacy/.old re-suffix shows up here as a
                    # comment edit, which the symbol-list comm diff can miss.
                    nameChanged:
                      (($b._comment != null)
                        and ($a._comment != null)
                        and ($a._comment != $b._comment)),
                    nameOld: ($b._comment // ""),
                    nameNew: ($a._comment // ""),
                    # Tooltip text changed this run. Covers curator edits in a
                    # human PR and the script-driven decay/expiry from
                    # check_tooltip_expiry. Classified into added (empty→text),
                    # removed (text→empty, e.g. an expired notice), and changed
                    # (text→different text, e.g. a decayed message). A missing
                    # field reads as empty so add/remove are symmetric.
                    tooltipAdded:
                      ((($b.tooltip_message // "") == "") and (($a.tooltip_message // "") != "")),
                    tooltipRemoved:
                      ((($b.tooltip_message // "") != "") and (($a.tooltip_message // "") == "")),
                    tooltipChanged:
                      ((($b.tooltip_message // "") != "")
                        and (($a.tooltip_message // "") != "")
                        and (($a.tooltip_message // "") != ($b.tooltip_message // ""))),
                  }
              ) as $rows
            | $rows
          ' osmosis-1/osmosis.zone_assets.json > /tmp/lifecycle-diff.json

          # Write one file per category, "chain|symbol" per line. ibcFlagged
          # carries a third column with the unstable reason so the summary can
          # report what each asset was flagged for, and ibcCleared the reason
          # it had been flagged for (its current reason is empty).
          jq -r '.[] | select(.ibcFlagged == true) | "\(.chain)|\(.symbol)|\(.reason)"' /tmp/lifecycle-diff.json > /tmp/lc-ibcFlagged.txt
          jq -r '.[] | select(.ibcCleared == true) | "\(.chain)|\(.symbol)|was \(if (.unstableReasonOld // "") == "" then "?" else .unstableReasonOld end)"' /tmp/lifecycle-diff.json > /tmp/lc-ibcCleared.txt
          for kind in extendedHaltSet extendedHaltCleared plannedShutdownSet tooltipAdded tooltipRemoved tooltipChanged; do
            jq -r --arg k "$kind" '.[] | select(.[$k] == true) | "\(.chain)|\(.symbol)"' /tmp/lifecycle-diff.json > /tmp/lc-${kind}.txt
          done

          # Bridge-down / source-chain-killed halts carry the responsible reason
          # in a third column (symbol_reason render), so the glance shows whether
          # it was a bridge outage or a chain death.
          jq -r '.[] | select(.bridgeOrKillDepositSet == true) | "\(.chain)|\(.symbol)|\(.depositHaltReason)"' /tmp/lifecycle-diff.json > /tmp/lc-bridgeOrKillDepositSet.txt
          jq -r '.[] | select(.bridgeOrKillWithdrawalSet == true) | "\(.chain)|\(.symbol)|\(.withdrawalHaltReason)"' /tmp/lifecycle-diff.json > /tmp/lc-bridgeOrKillWithdrawalSet.txt
          jq -r '.[] | select(.bridgeOrKillDepositCleared == true) | "\(.chain)|\(.symbol)"' /tmp/lifecycle-diff.json > /tmp/lc-bridgeOrKillDepositCleared.txt
          jq -r '.[] | select(.bridgeOrKillWithdrawalCleared == true) | "\(.chain)|\(.symbol)"' /tmp/lifecycle-diff.json > /tmp/lc-bridgeOrKillWithdrawalCleared.txt

          # Reason-shift and rename rows carry "old → new" in the third column so
          # the transition is legible (rendered via the symbol_reason mode).
          jq -r '.[] | select(.unstableReasonChanged == true) | "\(.chain)|\(.symbol)|\(.unstableReasonOld) → \(.reason)"' /tmp/lifecycle-diff.json > /tmp/lc-unstableReasonChanged.txt
          jq -r '.[] | select(.nameChanged == true) | "\(.chain)|\(.symbol)|\(.nameOld) → \(.nameNew)"' /tmp/lifecycle-diff.json > /tmp/lc-nameChanged.txt

          # Capture summary counts from the lifecycle script logs.
          if [ -f extended-halts.log ]; then
            # Assets whose planned_shutdown_date has passed while their
            # withdrawal direction is still open: funds may strand if the source
            # chain stops. The script prints one "past_due_withdrawals_open" line
            # per such asset under PLANNED-SHUTDOWN NOTIFICATIONS; count them so
            # the action banner can surface this loudly. Highest-consequence
            # signal these checks emit.
            echo "PAST_DUE_WITHDRAWALS=$(grep -oP 'past_due_withdrawals_open' extended-halts.log 2>/dev/null | wc -l | tr -d ' ')" >> $GITHUB_ENV
          fi

      - name: Persist manual-halt chain set to state
        run: |
          # Record the current set of chains with any manual halt as a
          # top-level state.json key so the next run can diff against it to
          # surface "newly halted this run" (see the Snapshot step). A chain
          # counts as manual if its overall unstable reason or either
          # per-direction halt reason is "manual" AND at least one direction
          # is actually halted. A manual unstable flag with transfers open is
          # a warning, not a halt, and is reported separately. Distinct
          # chains, sorted.
          jq -r '
            [ .assets[]
              | select(
                  ((.osmosis_unstable_reason == "manual")
                    or (.osmosis_deposit_halt_reason == "manual")
                    or (.osmosis_withdrawal_halt_reason == "manual"))
                  and ((.osmosis_halt_deposits == true)
                    or (.osmosis_halt_withdrawals == true))
                )
              | .chain_name
            ] | sort | unique
          ' osmosis-1/osmosis.zone_assets.json > /tmp/manual-halts-now.json
          jq --slurpfile mh /tmp/manual-halts-now.json \
            '.manualHaltChains = $mh[0]' \
            osmosis-1/generated/state/state.json > /tmp/state-with-mh.json
          mv /tmp/state-with-mh.json osmosis-1/generated/state/state.json

      - name: Report Dead Chains and Planned Shutdowns
        working-directory: ./.github/workflows/utility
        run: |
          # Report-only. Reads the state.json produced by validateEndpoints and
          # the Generate Assetlist step (which calls updateState), plus the
          # chain-registry submodule. The
          # heavy half (gov-proposal scan + cosmos.directory corroboration) runs
          # only on Mondays via --weekly to bound CI cost and external load; the
          # cheap dead-streak counter updates daily either way. Output is
          # captured and appended to the PR body. Never fails the pipeline.
          set +e
          # $WEEKLY_FLAG / $DEAD_CHAINS_WEEKLY come from the early
          # "Determine weekly (Monday) run" step.
          node report_dead_chains.mjs osmosis-1 $WEEKLY_FLAG > ../../../dead-chains.md 2> ../../../dead-chains.log
          cat ../../../dead-chains.log || true

      - name: Run code to Generate Zone Assets Comments
        working-directory: ./.github/workflows/utility
        run: node generateComments.mjs

      - name: Run localization
        working-directory: ./.github/workflows/utility
        # Calls the keyless community translation service directly (the
        # inlang-hosted RPC was decommissioned). The script never fails the
        # workflow: translation outages degrade to English-only descriptions
        # plus a ::warning:: annotation, and incomplete assets re-queue on the
        # next daily run.
        run: node translate_language_files.mjs

      - name: Run post-localization code
        working-directory: ./.github/workflows/utility
        run: node localization_post.mjs

      - name: Generate Workflow Summary
        run: |
          # Layout: the auto-merge gate is prepended later, then the action
          # banner, then a quick summary of what changed this run, then one
          # section per check. Every section has the same shape: a "##" heading,
          # a one-line **Status:**, the rows that changed this run, and any
          # standing data or explanation collapsed in <details>.
          S=workflow-summary.md
          cat > $S << 'HEADER'
          # Automated Update Summary
          HEADER

          section() { { echo ""; echo "---"; echo ""; echo "## $1"; echo ""; } >> $S; }
          status() { { echo "**Status:** $1"; echo ""; } >> $S; }
          # "key : N" lines from a lifecycle script's SUMMARY block, as
          # "key N, key N". The distinct-chains tally is a cap input, not a
          # change, so it is left out.
          log_counts() {
            [ -f "$1" ] || return 0
            sed -n "/$2/,\$p" "$1" \
              | grep -E '^ +[a-z_]+ *: *[0-9]+ *$' \
              | grep -v distinct \
              | sed -E 's/^ +([a-z_]+) *: *([0-9]+) *$/\1 \2/; s/_/ /g' \
              | paste -sd ',' - | sed 's/,/, /g' || true
          }
          # A key=value counter from a script's stderr log, default 0.
          log_value() { grep -oP "$2=\K[0-9]+" "$1" 2>/dev/null | head -1 || true; }

          # ── Action-required banner (very top) ─────────────────────────────
          # Only signals a human needs to act on. Each bullet points at the
          # section that carries the detail. Empty → an explicit all-clear line.
          declare -a ACTIONS=()

          # Funds-at-risk first: a planned-shutdown date has passed while the
          # asset's withdrawal direction is still open (count captured from
          # extended-halts.log above). Highest consequence.
          if [ "${PAST_DUE_WITHDRAWALS:-0}" -gt 0 ]; then
            ACTIONS+=("🟥 **${PAST_DUE_WITHDRAWALS}** asset(s) past planned-shutdown with withdrawals still open (see Extended halts)")
          fi
          # Mutation caps: the script's intended diff was NOT applied this run.
          if [ "$IBC_CAP_HIT" = "true" ]; then
            ACTIONS+=("🛑 IBC client check hit the mutation cap, diff not applied (see Mutation cap)")
          fi
          if [ "$EXTENDED_HALTS_CAP_HIT" = "true" ]; then
            ACTIONS+=("🛑 Extended-halts check hit the mutation cap, diff not applied (see Mutation cap)")
          fi
          # Connectivity-failed chains whose assets are NOT already covered by a
          # halt: the endpoint report tags these "halt deposits / investigate".
          # Match the text only, not the leading emoji (grep can mis-handle the
          # multibyte emoji in the pattern depending on the runner locale).
          UNCOVERED_DOWN=$(grep -c 'halt deposits / investigate' validation-summary.md 2>/dev/null || true)
          UNCOVERED_DOWN=${UNCOVERED_DOWN:-0}
          if [ "$UNCOVERED_DOWN" -gt 0 ]; then
            ACTIONS+=("🛑 **${UNCOVERED_DOWN}** down chain(s) with deposits still open (see Endpoint validation)")
          fi
          # A chain that stopped producing blocks while its endpoints still
          # answer never shows as a connectivity failure, so the dead-chain
          # report's recently-stale list is the only place it appears. Counted
          # only when deposits are still open on it.
          HALTED_OPEN=$(log_value dead-chains.log stale_recent_uncovered)
          if [ "${HALTED_OPEN:-0}" -gt 0 ]; then
            ACTIONS+=("🛑 **${HALTED_OPEN}** recently halted chain(s) with deposits still open (see Dead chain candidates)")
          fi
          # IBC client errors leave those channels' flags unchanged for a day.
          # Transient LCD trouble (rate limits, timeouts, 5xx) on a handful of
          # channels clears itself on the next run, so it stays in the IBC
          # section; anything else, or a widespread failure, needs a look.
          IBC_TRANSIENT=$(sed -n '/error breakdown:/,/^=/p' ibc-check.log 2>/dev/null \
            | grep -E '^ +(rate_limit|timeout|server_error) *:' \
            | awk -F: '{s += $2} END {print s + 0}' || true)
          IBC_TRANSIENT=${IBC_TRANSIENT:-0}
          IBC_OTHER=$(( ${IBC_ERRORS:-0} - IBC_TRANSIENT ))
          if [ "$IBC_OTHER" -gt 0 ] || [ "${IBC_ERRORS:-0}" -ge 10 ]; then
            ACTIONS+=("⚠️ **${IBC_ERRORS}** IBC client check error(s), flag state may be stale (see IBC client health)")
          fi
          # A human PR halted something this run (e.g. pausing a chain). The
          # current manual-halt set is computed in the standing-halts section
          # below; recompute the bare chain set here so the banner can use it.
          jq -r '
            .assets
            | map(select(
                ((.osmosis_unstable_reason == "manual")
                  or (.osmosis_deposit_halt_reason == "manual")
                  or (.osmosis_withdrawal_halt_reason == "manual"))
                and ((.osmosis_halt_deposits == true)
                  or (.osmosis_halt_withdrawals == true))
              ))
            | map(.chain_name) | unique | .[]
          ' osmosis-1/osmosis.zone_assets.json 2>/dev/null | sort > /tmp/lc-manualHalts.txt || : > /tmp/lc-manualHalts.txt
          # Delta against the previous run's persisted set (see the Snapshot
          # step): chains newly manual-halted, and chains whose manual halt was
          # lifted.
          comm -13 /tmp/manual-halts-prev.txt /tmp/lc-manualHalts.txt \
            > /tmp/lc-manualHaltsNew.txt 2>/dev/null || : > /tmp/lc-manualHaltsNew.txt
          comm -23 /tmp/manual-halts-prev.txt /tmp/lc-manualHalts.txt \
            > /tmp/lc-manualHaltsLifted.txt 2>/dev/null || : > /tmp/lc-manualHaltsLifted.txt
          if [ -s /tmp/lc-manualHaltsNew.txt ]; then
            NEW_MANUAL=$(awk 'NF>0' /tmp/lc-manualHaltsNew.txt | wc -l | tr -d ' ')
            ACTIONS+=("⚠️ **${NEW_MANUAL}** new manual halt(s) this run, confirm intended (see Quick summary)")
          fi
          # Dead-chain candidates only resolve on the weekly corroborated run,
          # and only those with deposits still open need action. An older
          # report without the uncovered count falls back to the total.
          if [ "$DEAD_CHAINS_WEEKLY" = "true" ]; then
            DEAD_OPEN=$(log_value dead-chains.log candidates_uncovered)
            [ -n "$DEAD_OPEN" ] || DEAD_OPEN=$(log_value dead-chains.log candidates)
            if [ "${DEAD_OPEN:-0}" -gt 0 ]; then
              ACTIONS+=("⚰️ **${DEAD_OPEN}** dead-chain candidate(s) with deposits still open (see Dead chain candidates)")
            fi
          fi
          # Counterparty client sweep (weekly only): week-1 candidates get a
          # heads-up row so a curator can fix the relayer or halt manually
          # before next Monday's run auto-halts. An invalid sweep means the
          # counterparty signal is missing this week entirely.
          if [ "$DEAD_CHAINS_WEEKLY" = "true" ]; then
            if [ "${IBC_CP_CANDIDATES:-0}" -gt 0 ]; then
              ACTIONS+=("⚠️ **${IBC_CP_CANDIDATES}** counterparty client(s) non-Active (week 1 of 2), auto-halts next Monday if unresolved (see IBC client health)")
            fi
            if [ "${IBC_CP_SWEEP_INVALID:-0}" -gt 0 ]; then
              ACTIONS+=("⚠️ Counterparty client sweep invalid this week, streaks not advanced (see IBC client health)")
            fi
          fi

          if [ "${#ACTIONS[@]}" -eq 0 ]; then
            echo "## ✅ No action required" >> $S
          else
            echo "## 🚨 Action required (${#ACTIONS[@]})" >> $S
            echo "" >> $S
            for a in "${ACTIONS[@]}"; do
              echo "- ${a}" >> $S
            done
          fi
          echo "" >> $S

          # ── Quick summary: what changed this run ──────────────────────────
          # One row per non-empty category; standing state (halts already in
          # effect) lives in its own section at the bottom. If nothing changed,
          # a single "nothing notable" line stands in.
          echo "## 📋 Quick summary" >> $S
          echo "" >> $S

          QS_ROWS=0
          # emit_row <emoji> <label> <file> <mode>. mode selects how each line
          # of the file renders:
          #   name           whole line is the display value (chain names)
          #   symbol         "chain|symbol", display the symbol column
          #   symbol_reason  "chain|symbol|reason", display "symbol (reason)"
          emit_row() {
            local emoji="$1" label="$2" file="$3" mode="$4"
            local -a items=()
            if [ -f "$file" ] && [ -s "$file" ]; then
              case "$mode" in
                symbol)        mapfile -t items < <(awk -F'|' 'NF>0{print $2}' "$file") ;;
                symbol_reason) mapfile -t items < <(awk -F'|' 'NF>0{print $2" ("$3")"}' "$file") ;;
                *)             mapfile -t items < <(awk 'NF>0' "$file") ;;
              esac
            fi
            [ "${#items[@]}" = "0" ] && return 0
            QS_ROWS=$((QS_ROWS + 1))
            echo "- ${emoji} **${label} (${#items[@]}):**" >> $S
            for item in "${items[@]}"; do
              echo "  - ${item}" >> $S
            done
          }

          emit_row "🆕" "New chains" new-chains.txt name
          emit_row "🆕" "New assets" new-assets.txt name
          # A rename surfaces as a removed old symbol plus a new symbol above;
          # the rename row below names the pairing.
          emit_row "🗑️" "Removed chains" removed-chains.txt name
          emit_row "🗑️" "Removed assets" removed-assets.txt name
          emit_row "🏷️" "Renamed assets" /tmp/lc-nameChanged.txt symbol_reason
          emit_row "✅" "Assets verified" newly-verified.txt name
          # Unstable flips from any check (IBC client, market health, a curator
          # PR). The reason says which; the cleared row carries the reason the
          # asset was flagged for.
          emit_row "🔴" "Flagged unstable" /tmp/lc-ibcFlagged.txt symbol_reason
          emit_row "🟢" "Unstable cleared" /tmp/lc-ibcCleared.txt symbol_reason
          emit_row "🔁" "Unstable reason changed" /tmp/lc-unstableReasonChanged.txt symbol_reason
          emit_row "⛔" "Deposit halt set (bridge/chain)" /tmp/lc-bridgeOrKillDepositSet.txt symbol_reason
          emit_row "⛔" "Withdrawal halt set (bridge/chain)" /tmp/lc-bridgeOrKillWithdrawalSet.txt symbol_reason
          emit_row "🔓" "Deposit halt cleared (bridge/chain)" /tmp/lc-bridgeOrKillDepositCleared.txt symbol
          emit_row "🔓" "Withdrawal halt cleared (bridge/chain)" /tmp/lc-bridgeOrKillWithdrawalCleared.txt symbol
          emit_row "🆕" "Manual halts added (chains)" /tmp/lc-manualHaltsNew.txt name
          emit_row "🔓" "Manual halts lifted (chains)" /tmp/lc-manualHaltsLifted.txt name
          emit_row "⏸️" "Extended halt set" /tmp/lc-extendedHaltSet.txt symbol
          emit_row "▶️" "Extended halt cleared" /tmp/lc-extendedHaltCleared.txt symbol
          emit_row "⏰" "Planned shutdown set" /tmp/lc-plannedShutdownSet.txt symbol
          # Tooltip text changes (curator PR edits + script-driven decay/expiry).
          emit_row "💬" "Tooltips added" /tmp/lc-tooltipAdded.txt symbol
          emit_row "💬" "Tooltips changed" /tmp/lc-tooltipChanged.txt symbol
          emit_row "🚫" "Tooltips removed" /tmp/lc-tooltipRemoved.txt symbol

          if [ "$QS_ROWS" = "0" ]; then
            echo "- _Nothing notable this run (metadata/endpoint refresh only)._" >> $S
          fi

          # ── Mutation cap (only when hit) ──────────────────────────────────
          # A lifecycle script exited 2 because its intended diff would touch
          # more than 10 distinct source chains; none of its mutations were
          # applied this run.
          if [ "$IBC_CAP_HIT" = "true" ] || [ "$EXTENDED_HALTS_CAP_HIT" = "true" ]; then
            section "⚠️ Mutation cap"
            status "a lifecycle script's diff would touch more than 10 source chains, so none of its mutations were applied this run"
            [ "$IBC_CAP_HIT" = "true" ] && echo "- 🛑 \`check_ibc_clients\` cap exceeded" >> $S
            [ "$EXTENDED_HALTS_CAP_HIT" = "true" ] && echo "- 🛑 \`check_extended_halts\` cap exceeded" >> $S
            {
              echo ""
              echo "Inspect the logs, then review and apply the diff locally:"
              echo ""
              echo '```bash'
              echo "cd .github/workflows/utility"
              echo "node <script-name>.mjs osmosis-1 --dry-run    # review"
              echo "node <script-name>.mjs osmosis-1 --force      # apply"
              echo '```'
            } >> $S
          fi

          # ── Assets and chains ─────────────────────────────────────────────
          section "🧩 Assets and chains"
          TOTAL_ASSETS=$(jq '.assets | length' osmosis-1/generated/frontend/assetlist.json)
          TOTAL_CHAINS=$(jq '.chains | length' osmosis-1/generated/frontend/chainlist.json)
          status "${TOTAL_ASSETS} assets (${NEW_ASSETS_COUNT:-0} new, ${NEWLY_VERIFIED_COUNT:-0} newly verified, ${REMOVED_ASSETS_COUNT:-0} removed); ${TOTAL_CHAINS} chains (${NEW_CHAINS_COUNT:-0} new, ${REMOVED_CHAINS_COUNT:-0} removed)."

          # One block per asset: symbol and name, then chain, denom and
          # description.
          asset_block() {
            local symbol="$1" data
            data=$(jq -c --arg s "$symbol" '[.assets[] | select(.symbol == $s)][0] // {}' osmosis-1/generated/frontend/assetlist.json)
            {
              echo "- **$symbol** - $(echo "$data" | jq -r '.name // "-"')"
              echo "  - **Chain:** $(echo "$data" | jq -r '.chainName // "-"')"
              echo "  - **Denom:** \`$(echo "$data" | jq -r '.coinMinimalDenom // "-"')\`"
              local desc
              desc=$(echo "$data" | jq -r '.description // ""')
              [ -n "$desc" ] && echo "  - **Description:** $desc"
              echo ""
            } >> $S
          }
          if [ "${NEW_ASSETS_COUNT:-0}" -gt 0 ]; then
            echo "### 🆕 New assets" >> $S
            echo "" >> $S
            while IFS= read -r symbol; do asset_block "$symbol"; done < new-assets.txt
          fi
          if [ "${NEWLY_VERIFIED_COUNT:-0}" -gt 0 ]; then
            echo "### ✅ Newly verified assets" >> $S
            echo "" >> $S
            while IFS= read -r symbol; do asset_block "$symbol"; done < newly-verified.txt
          fi
          if [ "${NEW_CHAINS_COUNT:-0}" -gt 0 ]; then
            echo "### 🆕 New chains" >> $S
            echo "" >> $S
            while IFS= read -r chain; do
              # pretty_name can be null for a chain stub; show the bare name then.
              PRETTY_NAME=$(jq -r --arg c "$chain" '.chains[] | select(.chain_name == $c) | .pretty_name // empty' osmosis-1/generated/frontend/chainlist.json)
              if [ -n "$PRETTY_NAME" ]; then
                echo "- **$chain** ($PRETTY_NAME)" >> $S
              else
                echo "- **$chain**" >> $S
              fi
            done < new-chains.txt
            echo "" >> $S
          fi

          # ── IBC client health ─────────────────────────────────────────────
          section "🔗 IBC client health"
          IBC_STATUS="${IBC_NEWLY_FLAGGED:-0} newly flagged, ${IBC_NEWLY_CLEARED:-0} auto-cleared, ${IBC_ERRORS:-0} lookup error(s)"
          if [ "${IBC_ERRORS:-0}" -gt 0 ]; then
            IBC_STATUS="${IBC_STATUS} (${IBC_TRANSIENT} transient; those channels keep yesterday's flags)"
          fi
          status "${IBC_STATUS}."
          # Counterparty client sweep lines (weekly runs only). Candidates are
          # a heads-up: one more non-Active Monday reading auto-halts them.
          if [ "$DEAD_CHAINS_WEEKLY" = "true" ]; then
            if [ "${IBC_CP_SWEEP_INVALID:-0}" -gt 0 ]; then
              echo "- **Counterparty sweep:** invalid this week (too many non-Active readings at once); streaks not advanced" >> $S
            else
              echo "- **Counterparty clients newly halted (2-week streak):** ${IBC_CP_HALTED:-0}" >> $S
              echo "- **Counterparty client candidates (week 1 of 2, auto-halts next Monday if unresolved):** ${IBC_CP_CANDIDATES:-0}" >> $S
            fi
            echo "" >> $S
          fi
          # The check's own summary block, from its marker to EOF, so every
          # weekly HALT/WARN line is included without a length cap.
          if [ -f ibc-check.log ] && grep -q 'BRIDGE-STATE CHECK SUMMARY' ibc-check.log; then
            {
              echo "<details><summary>IBC check output</summary>"
              echo ""
              echo '```'
              sed -n '/BRIDGE-STATE CHECK SUMMARY/,$p' ibc-check.log
              echo '```'
              echo "</details>"
            } >> $S
          fi

          # ── Market health ─────────────────────────────────────────────────
          section "📈 Market health"
          MH=$(log_counts market-health.log 'MARKET-HEALTH SUMMARY')
          status "${MH:-no changes}."
          if [ -n "$MH" ]; then
            {
              echo "<details><summary>Market health output</summary>"
              echo ""
              echo '```'
              grep -A 30 'MARKET-HEALTH SUMMARY' market-health.log | head -30
              echo '```'
              echo "</details>"
            } >> $S
          fi

          # ── Extended halts ────────────────────────────────────────────────
          section "⏸️ Extended halts"
          EH=$(log_counts extended-halts.log 'EXTENDED HALTS SUMMARY')
          # Planned-shutdown notifications (e.g. withdrawals still open past the
          # shutdown date) are not mutations, so they can appear on a run with
          # no changes. Count and show them on their own.
          EH_NOTES=$(sed -n '/PLANNED-SHUTDOWN NOTIFICATIONS/,$p' extended-halts.log 2>/dev/null             | grep -cE '^ +(⚠️ +)?[a-z_]+ ' || true)
          EH_STATUS="${EH:-no changes}"
          if [ "${EH_NOTES:-0}" -gt 0 ]; then
            EH_STATUS="${EH_STATUS}; ${EH_NOTES} planned-shutdown notification(s), ${PAST_DUE_WITHDRAWALS:-0} with withdrawals open past the shutdown date"
          fi
          status "${EH_STATUS}."
          if [ -n "$EH" ] || [ "${EH_NOTES:-0}" -gt 0 ]; then
            {
              echo "<details$( [ "${PAST_DUE_WITHDRAWALS:-0}" -gt 0 ] && echo ' open')><summary>Extended halts output</summary>"
              echo ""
              echo '```'
              sed -n '/EXTENDED HALTS SUMMARY/,$p' extended-halts.log
              echo '```'
              echo "</details>"
            } >> $S
          fi

          # ── Endpoint validation ───────────────────────────────────────────
          # The report starts with its own **Status:** line.
          section "📡 Endpoint validation"
          if [ -f validation-summary.md ]; then
            cat validation-summary.md >> $S
          else
            status "report missing this run"
          fi

          # ── Dead chains, planned shutdowns, upstream kills ────────────────
          # report_dead_chains.mjs emits its own "##" sections, each opening
          # with a **Status:** line.
          if [ -f dead-chains.md ]; then
            echo "" >> $S
            awk 'NR == 1 && /^## / { print "---"; print "" } { print }' dead-chains.md >> $S
          fi

          # ── Standing manual and planned-shutdown halts ────────────────────
          # State the daily scripts will not clear on their own: "manual" is
          # the curator lock, and planned-shutdown halts are normally
          # tooltip-locked until the curator releases them. Shown every run so
          # forgotten halts stay visible.
          #
          # Assets flagged manual or planned_shutdown on ANY of the three reason
          # fields, enriched with the display symbol and bridge hop from the
          # generated frontend assetlist (joined on chainName|sourceDenom), plus
          # the chain's total listed-asset count. The hop is the first
          # counterparty cosmos chain that is not the origin itself, so a halt
          # caused by the hop (e.g. PSTAKE routed via a compromised Gravity
          # Bridge) is attributable at a glance.
          STANDING_HALTS=$(jq --slurpfile fe osmosis-1/generated/frontend/assetlist.json '
            ($fe[0].assets
              | map({ key: (.chainName + "|" + .sourceDenom), value: . })
              | from_entries) as $byOrigin
            | (.assets | group_by(.chain_name)
              | map({ key: .[0].chain_name, value: length })
              | from_entries) as $totals
            | .assets
            | map(select(
                (.osmosis_unstable_reason == "manual")
                or (.osmosis_unstable_reason == "planned_shutdown")
                or (.osmosis_deposit_halt_reason == "manual")
                or (.osmosis_deposit_halt_reason == "planned_shutdown")
                or (.osmosis_withdrawal_halt_reason == "manual")
                or (.osmosis_withdrawal_halt_reason == "planned_shutdown")
              ))
            | map(. as $a
                | ($byOrigin[$a.chain_name + "|" + $a.base_denom]) as $f
                | . + {
                    symbol: ($f.symbol // $a._comment // $a.base_denom),
                    hop: ([ ($f.counterparty // [])[]
                            | select(.chainType == "cosmos" and .chainName != $a.chain_name)
                            | .chainName ] | first),
                    chain_total: ($totals[$a.chain_name] // 0),
                    # Table-safe tooltip: a "|" or newline would break the row.
                    tooltip: (($a.tooltip_message // "") | gsub("\\|"; "\\|") | gsub("\n"; " ")),
                    # check_tooltip_expiry.mjs acts after the expiry day (UTC).
                    # It only removes or replaces the tooltip: a halt stays in
                    # place, now without the explanation.
                    # An unparseable date reads as "invalid", never as expired.
                    expiry: (
                      if $a.tooltip_expiry_date then
                        (try ((("\($a.tooltip_expiry_date)T23:59:59Z" | fromdate) - now) / 86400 | floor) catch null) as $days
                        | if $days == null then "\($a.tooltip_expiry_date) (invalid date)"
                          else "\($a.tooltip_expiry_date) (" + (if $days < 0 then "due" else "in \($days)d" end) + "): tooltip "
                            + (if (($a.tooltip_decay_message // "") != "") then "replaced" else "removed" end)
                          end
                      elif $a.planned_shutdown_date then "shutdown \($a.planned_shutdown_date)"
                      else null end
                    )
                  })
          ' osmosis-1/osmosis.zone_assets.json)
          # Split off assets with no direction halted: a manual unstable flag
          # with transfers open is a warning, listed in its own table below,
          # not a halt.
          STANDING_WARNINGS=$(echo "$STANDING_HALTS" | jq '
            map(select((.osmosis_halt_deposits != true) and (.osmosis_halt_withdrawals != true)))')
          STANDING_HALTS=$(echo "$STANDING_HALTS" | jq '
            map(select((.osmosis_halt_deposits == true) or (.osmosis_halt_withdrawals == true)))')
          STANDING_HALT_COUNT=$(echo "$STANDING_HALTS" | jq 'length')
          STANDING_HALT_CHAINS=$(echo "$STANDING_HALTS" | jq '[.[].chain_name] | unique | length')
          STANDING_WARNING_COUNT=$(echo "$STANDING_WARNINGS" | jq 'length')
          STANDING_EXPIRING=$(echo "$STANDING_HALTS" "$STANDING_WARNINGS" | jq -s 'add | map(select(.tooltip_expiry_date)) | length')
          STANDING_NO_TOOLTIP=$(echo "$STANDING_HALTS" | jq 'map(select(.tooltip == "")) | length')

          section "🛑 Standing manual and planned-shutdown halts"
          status "${STANDING_HALT_COUNT} asset(s) halted across ${STANDING_HALT_CHAINS} chain(s), ${STANDING_NO_TOOLTIP} without a tooltip; ${STANDING_WARNING_COUNT} asset(s) with a manual warning and transfers open; ${STANDING_EXPIRING} tooltip(s) set to expire."

          if [ "$STANDING_HALT_COUNT" -gt 0 ]; then
            # One compact row per chain. "Assets halted" reads "X of Y" against
            # the chain's full listing so a single-asset halt (e.g. USDN on
            # noble) cannot read as a whole-chain halt, and the impacted symbols
            # are named in the row. Tooltip lists the distinct messages users
            # see (and flags halted assets with none); Expires shows the
            # earliest tooltip expiry or planned shutdown. The per-asset,
            # per-direction breakdown is collapsed below.
            echo "| Chain | Assets halted | Impacted assets | Directions | Reason(s) | Tooltip | Expires |" >> $S
            echo "|-------|---------------|-----------------|------------|-----------|---------|---------|" >> $S
            echo "$STANDING_HALTS" | jq -r '
              group_by(.chain_name)
              | map({
                  chain: .[0].chain_name,
                  halted: length,
                  total: .[0].chain_total,
                  assets: (
                    [ .[] | .symbol + (if .hop then " (via \(.hop))" else "" end) ]
                    | if length > 8 then .[0:8] + ["+\(length - 8) more"] else . end
                    | join(", ")
                  ),
                  directions: (
                    [ .[]
                      | ( if .osmosis_halt_deposits == true then "deposit" else empty end ),
                        ( if .osmosis_halt_withdrawals == true then "withdrawal" else empty end )
                    ] | unique
                    | (if length == 0 then ["unstable only"] else . end)
                    | join(", ")
                  ),
                  reasons: (
                    [ .[]
                      | ( .osmosis_deposit_halt_reason // empty ),
                        ( .osmosis_withdrawal_halt_reason // empty ),
                        ( .osmosis_unstable_reason // empty )
                    ] | unique | join(", ")
                  ),
                  tooltips: (
                    ([ .[] | select(.tooltip == "") ] | length) as $missing
                    | [ .[] | .tooltip | select(. != "") ] | unique
                    | . + (if $missing > 0 then ["⚠️ \($missing) asset(s) without a tooltip"] else [] end)
                    | join("<br>")
                  ),
                  expires: (
                    [ .[] | .expiry // empty ] | unique
                    | if length == 0 then "-" else join("<br>") end
                  )
                })
              | .[]
              | "| \(.chain) | \(.halted) of \(.total) | \(.assets) | \(.directions) | \(.reasons) | \(.tooltips) | \(.expires) |"
            ' >> $S

            echo "" >> $S
            echo "<details><summary>Full standing-halt breakdown (${STANDING_HALT_COUNT} asset(s), per direction)</summary>" >> $S
            echo "" >> $S
            # Route renders as the origin chain plus "via <hop>" when present,
            # so a native Gravity asset reads "gravitybridge" while a
            # Persistence asset bridged in via Gravity reads "persistence via
            # gravitybridge".
            echo "| Symbol | Route | Base denom | Direction | Reason | Tooltip | Expires |" >> $S
            echo "|--------|-------|-----------|-----------|--------|---------|---------|" >> $S
            echo "$STANDING_HALTS" | jq -r '
              .[]
              | . as $a
              | ($a.symbol) as $sym
              | (if $a.hop then $a.chain_name + " via " + $a.hop else $a.chain_name end) as $route
              | [
                  (if .osmosis_halt_deposits == true then
                     "| \($sym) | \($route) | \(.base_denom) | deposit | \(.osmosis_deposit_halt_reason // "") | \(if .tooltip == "" then "⚠️ none" else .tooltip end) | \(.expiry // "-") |"
                   else empty end),
                  (if .osmosis_halt_withdrawals == true then
                     "| \($sym) | \($route) | \(.base_denom) | withdrawal | \(.osmosis_withdrawal_halt_reason // "") | \(if .tooltip == "" then "⚠️ none" else .tooltip end) | \(.expiry // "-") |"
                   else empty end)
                ]
              | .[]
            ' >> $S
            echo "" >> $S
            echo "</details>" >> $S
          fi

          # Manual warnings: curator-set unstable flags with both directions
          # open (e.g. a supply incident on a chain that has since recovered).
          if [ "$STANDING_WARNING_COUNT" -gt 0 ]; then
            echo "" >> $S
            echo "### Manual warnings, transfers open (${STANDING_WARNING_COUNT} asset(s))" >> $S
            echo "" >> $S
            echo "| Symbol | Route | Reason | Tooltip | Expires |" >> $S
            echo "|--------|-------|--------|---------|---------|" >> $S
            echo "$STANDING_WARNINGS" | jq -r '
              .[]
              | (if .hop then .chain_name + " via " + .hop else .chain_name end) as $route
              | "| \(.symbol) | \($route) | \(.osmosis_unstable_reason // "") | \(if .tooltip == "" then "⚠️ none" else .tooltip end) | \(.expiry // "-") |"
            ' >> $S
          fi
          echo "" >> $S

      - name: Auto-merge Safety Gate
        working-directory: ./.github/workflows/utility
        run: |
          # Decides whether this run is safe to auto-merge. Scoped to VERIFIED
          # assets: that is the curated, default-visible set, and the only place
          # these changes are user-facing. Blocks when:
          #   - an existing VERIFIED asset had a financially sensitive field
          #     change (decimals, coinMinimalDenom, sourceDenom, origin chain,
          #     contract, IBC path, display name). This is the primary purpose:
          #     such a change fires no lifecycle row and never shows up in
          #     new-assets.txt, so only the before/after comparison sees it;
          #   - a VERIFIED asset was removed from the generated list;
          #   - an unclassified lifecycle category fired, or a required input was
          #     missing or empty.
          #
          # Deliberately does NOT block on lifecycle status changes (unstable
          # flips, halts set/cleared, reason shifts): the pipeline is responding
          # to real chain conditions and the summary below already itemises them,
          # so holding the merge for them stalled the assetlist over routine
          # bridge outages. Nor on new-asset symbol collisions, which in practice
          # flagged ordinary dotted bridge listings rather than impersonations.
          # Also ignores tooltip text, isAlloyed, coingeckoId, and anything scoped
          # to unverified assets (an unverified removal count is still reported,
          # since a large drop can mean a broken generation run).
          #
          # Fails closed: exit 1 means the gate could not evaluate (missing or
          # unreadable inputs), and the merge step below treats that the same as
          # a block. The gate makes no network calls, so there is no market-data
          # outage that can stall it. `set +e` keeps the pipeline itself green
          # either way so the PR is still created and reviewable. The gate never
          # decides whether the PR exists, only whether it merges itself.
          set +e
          # --before is the pre-generation assetlist copy from "Capture Current
          # Assets". Its absence blocks rather than passing silently, since every
          # asset would otherwise read as unchanged.
          node check_automerge_gate.mjs osmosis-1 \
            --before /tmp/frontend-before.json \
            > ../../../gate-report.md
          rc=$?
          echo "Gate exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            # finish() already wrote GATE_BLOCKED=true for handled failures, but
            # an exit before that (e.g. arg parse) would leave it unset. Force it.
            echo "GATE_BLOCKED=true" >> $GITHUB_ENV
          fi
          # A crash before finish() writes its report leaves the file empty, which
          # would prepend a blank block and a stray separator to the PR body with
          # no verdict at all. Substitute a real explanation instead.
          if [ ! -s ../../../gate-report.md ]; then
            {
              echo "## 🛑 Auto-merge withheld (gate produced no report)"
              echo ""
              echo "\`check_automerge_gate.mjs\` exited with code $rc without writing a"
              echo "verdict, so the gate could not be evaluated. Auto-merge was withheld."
              echo "See the \"Auto-merge Safety Gate\" step log for the failure."
            } > ../../../gate-report.md
            echo "GATE_BLOCKED=true" >> $GITHUB_ENV
          fi
          exit 0

      - name: Prepend Gate Report to PR Body
        run: |
          # Gate verdict goes at the very top of the PR body so a withheld
          # merge is the first thing a reviewer sees. `-s` (non-empty) rather than
          # `-f`: an empty file would contribute a blank block and a stray `---`
          # with no verdict. The gate step substitutes a fallback report when it
          # produces nothing, so an empty file here means the step never ran.
          if [ -s gate-report.md ]; then
            cat gate-report.md > pr-body.md
            echo "" >> pr-body.md
            echo "---" >> pr-body.md
            echo "" >> pr-body.md
            cat workflow-summary.md >> pr-body.md
            mv pr-body.md workflow-summary.md
          fi

      - name: Create Pull Request
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[AUTO] Asset and Chain Update"
          branch: update/assetlist_all
          title: "[AUTO] Asset and Chain Update"
          body-path: workflow-summary.md
          delete-branch: true

      # Requires the POSITIVE pass value. `!= 'true'` would have merged whenever
      # GATE_BLOCKED was unset (an unset variable is the empty string), so a
      # skipped or crashed gate step read as permission to merge. Only an
      # explicit GATE_BLOCKED=false, which finish() writes solely after a
      # completed evaluation, allows auto-merge.
      - name: Enable Auto-merge
        if: steps.cpr.outputs.pull-request-number && github.event_name == 'schedule' && env.GATE_BLOCKED == 'false'
        run: |
          PR=${{ steps.cpr.outputs.pull-request-number }}
          # `main` currently has NO required status checks (the REST endpoint
          # returns 404 "Required status checks not enabled") and requires 0
          # approving reviews, so a freshly created bot PR is already mergeable.
          # GitHub rejects enablePullRequestAutoMerge on an already-clean PR, so
          # `--auto` fails here every time and a direct merge is what has always
          # landed these PRs.
          #
          # Prefer --auto so that the moment required checks ARE configured, the
          # merge waits on them. Fall back to a direct merge only when --auto was
          # rejected for "clean status", never when a check is failing or pending:
          # in that case leave the PR for a human. This keeps today's behaviour
          # working without reintroducing the unconditional `|| gh pr merge` that
          # would bypass a genuinely failing check.
          set +e
          auto_err=$(gh pr merge "$PR" --auto --squash 2>&1)
          auto_rc=$?
          set -e
          if [ "$auto_rc" -eq 0 ]; then
            echo "Auto-merge enabled on PR #$PR; it will merge when mergeable."
            exit 0
          fi
          echo "gh pr merge --auto failed (rc=$auto_rc): $auto_err"
          # Re-read mergeability. Only a clean, nothing-pending PR may be merged
          # directly. `mergeStateStatus` is CLEAN only when every check that does
          # exist has passed and there are no conflicts.
          state=$(gh pr view "$PR" --json mergeStateStatus,mergeable \
            --jq '"\(.mergeStateStatus)/\(.mergeable)"')
          echo "PR #$PR merge state: $state"
          case "$state" in
            CLEAN/MERGEABLE)
              echo "PR is clean with no pending checks; merging directly."
              gh pr merge "$PR" --squash
              ;;
            *)
              echo "PR is not in a clean mergeable state, so it was NOT merged."
              echo "Leaving it open for review rather than forcing the merge."
              gh label create "needs-review" \
                --color "d93f0b" \
                --description "Auto-merge withheld by the safety gate; needs human review" \
                2>/dev/null || true
              gh pr edit "$PR" --add-label "needs-review" || true
              ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror of the condition above: anything that is not an explicit pass
      # routes here, so a blocked verdict AND an unset one (skipped or crashed
      # gate step) both get labelled. Without the unset case this step would not
      # run, leaving an unmerged PR with no label and no explanation.
      - name: Flag PR for Manual Review
        if: steps.cpr.outputs.pull-request-number && github.event_name == 'schedule' && env.GATE_BLOCKED != 'false'
        run: |
          # A skipped auto-merge must be visible, not a silent no-op. Label the
          # PR so it can be filtered, and log why.
          PR=${{ steps.cpr.outputs.pull-request-number }}
          if [ "$GATE_BLOCKED" = "true" ]; then
            echo "Auto-merge withheld by the safety gate; PR #$PR left open for review."
          else
            echo "GATE_BLOCKED was not set, so the gate verdict is unknown (the gate step"
            echo "may have been skipped or died early). Treating as blocked; PR #$PR left open."
          fi
          # The label may not exist yet (it did not when this was written), so
          # create it idempotently before applying. Labelling is best-effort:
          # the PR is already unmerged, which is the actual safety property.
          gh label create "needs-review" \
            --color "d93f0b" \
            --description "Auto-merge withheld by the safety gate; needs human review" \
            2>/dev/null || true
          gh pr edit "$PR" --add-label "needs-review" \
            || echo "Could not apply label; PR still left unmerged for review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
