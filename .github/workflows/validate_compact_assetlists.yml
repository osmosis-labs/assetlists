name: Validate compact assetlists
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/utility/compact_assetlist*'
      - '.github/workflows/utility/audit_assetlists*'
      - '.github/workflows/utility/generate_compact_assetlist.mjs'
      - '.github/workflows/utility/generate_assetlist.mjs'
      - '*/generated/frontend/assetlist*.json'
      - '.github/workflows/validate_compact_assetlists.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/utility/compact_assetlist*'
      - '.github/workflows/utility/audit_assetlists*'
      - '*/generated/frontend/assetlist*.json'
      - '.github/workflows/validate_compact_assetlists.yml'
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: node --test .github/workflows/utility/compact_assetlist.test.mjs .github/workflows/utility/audit_assetlists.test.mjs
